<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Keamanan: hanya boleh menjalankan kode dari situs ini sendiri, dan hanya boleh
       mengirim data ke situs ini serta ke Anthropic (tombol Tanya AI). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Catatan Finansial</title>
  <meta name="description" content="Catat pengeluaran dari notes, kategorikan otomatis, lihat dashboard bulanan.">
  <meta name="theme-color" content="#244a55">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="prevMonth" data-i18n-aria="nav.prev" aria-label="Previous month">‹</button>
    <div class="month-label">
      <span id="monthLabel"></span>
      <input type="month" id="monthPicker" data-i18n-aria="nav.pick" aria-label="Pick a month">
    </div>
    <button class="icon-btn" id="nextMonth" data-i18n-aria="nav.next" aria-label="Next month">›</button>
  </header>

  <main id="app">
    <section class="view" id="view-dashboard"></section>
    <section class="view" id="view-input"></section>
    <section class="view" id="view-tx"></section>
    <section class="view" id="view-budget"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <nav class="bottomnav" aria-label="Menu">
    <button data-view="dashboard"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v8h8"/></svg></span><span data-i18n="nav.dashboard">Dashboard</span></button>
    <button data-view="input"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span><span data-i18n="nav.input">Input Notes</span></button>
    <button data-view="tx"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><span data-i18n="nav.tx">Transactions</span></button>
    <button data-view="budget"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span><span data-i18n="nav.budget">Budget</span></button>
    <button data-view="settings"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></span><span data-i18n="nav.settings">Settings</span></button>
  </nav>

  <dialog id="txDialog">
    <form method="dialog" id="txForm" class="dialog-body">
      <h3 id="txDialogTitle"></h3>
      <label><span data-i18n="dl.desc">Description</span><input name="desc" required autocomplete="off"></label>
      <div class="row2">
        <label><span data-i18n="dl.amount">Amount (Rp)</span><input name="amount" class="num" inputmode="numeric" required autocomplete="off"></label>
        <label><span data-i18n="dl.date">Date</span><input name="date" type="date"></label>
      </div>
      <label><span data-i18n="dl.cat">Category</span><select name="catId"></select></label>
      <label><span data-i18n="dl.item">Item</span><select name="itemId"></select></label>
      <label class="check"><input type="checkbox" name="learn" checked> <span data-i18n="dl.learn">Remember this category for future notes</span></label>
      <div class="dialog-actions">
        <button type="button" class="btn ghost danger" id="txDelete" data-i18n="dl.del">Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="txCancel" data-i18n="dl.cancel">Cancel</button>
        <button type="submit" class="btn primary" data-i18n="dl.save">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
